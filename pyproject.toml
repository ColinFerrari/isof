[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isof"
version = "0.4.0"
description = "Python reader, verifier, signer and builder for the ISOF v1.0/1.1/1.2/1.3 format, open standard for geochemical isotopic, geochemistry, physicochemistry and dissolved molecules data exchange"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Colin Ferrari", email = "colin.ferrari@isofind.tech" }
]
keywords = [
    "isotopes",
    "geochemistry",
    "physicochemistry",
    "traceability",
    "forensics",
    "ISOF",
    "encryption",
    "X25519",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"

# Dépendances minimales volontairement réduites. `cryptography` est requis
# pour la signature niveau 2 et le déchiffrement v1.2 : il est désormais
# systématique (les fichiers chiffrés sont courants en usage terrain).
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pandas>=1.5",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://isofind.tech"
Repository = "https://github.com/ColinFerrari/isof"
"Bug Tracker" = "https://github.com/ColinFerrari/isof/issues"
Specification = "https://isofind.tech/isof-spec"

[tool.setuptools.packages.find]
where = ["."]
include = ["isof*"]

[tool.setuptools.package-data]
isof = ["trust/*.pem"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
