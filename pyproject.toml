[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isof"
version = "0.1.0"
description = "Lecteur et vérificateur du format ISOF — échange de données isotopiques"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "IsoFind SAS", email = "colin.ferrari@isofind.tech" }
]
keywords = ["isotopes", "geochemistry", "traceability", "forensics", "ISOF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"

# Dépendances minimales volontairement réduites
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pandas>=1.5",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://isofind.tech"
Repository = "https://github.com/ColinFerrari/isof"
"Bug Tracker" = "https://github.com/ColinFerrari/isof/issues"
Specification = "https://isofind.tech/isof-spec" (to come)

[tool.setuptools.packages.find]
where = ["."]
include = ["isof*"]

[tool.setuptools.package-data]
isof = ["trust/*.pem"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
